<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8" />
  </head>

  <body class="page">
    <header class="banner">
      <img class="img" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix image">
      <a class="more-details" 
        href="https://goal-life.com/page/method/matrix-eisenhower">
          Want more details?
        </a>
    </header>

    <main class="main">
      <h1 class="invisible">Todo App</h1>
      <section>
        <form class="new-task__form" id="new-task-form">
          <h2 class="title">Add Item</h2>
          <div class="new-task__wrapper">
            <input id="new-task-input" class="input new-task__input" type="text" required />
            <button type="submit" class="btn new-task__btn">Add</button>
          </div>
        </form>
      </section>

      <section>
        <h2 class="title">Todo</h2>

        <ul id="incomplete-tasks" class="todo__list">
          <li class="todo__item">
            <label class="todo__label label">
              <input type="checkbox" class="input" />
              <span class="todo__text">Pay bills</span>
            </label>
            <button type="button" class="todo__edit-btn btn">Edit</button>
            <button type="button" class="todo__delete-btn btn">
              <img class="img" src="./remove.svg" alt="">
            </button>
          </li>

          <li class="edit-mode todo__item">
            <input type="checkbox" class="input" />
            <label class="todo label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="todo input" />
            <button class="todo__edit-btn btn">Save</button>
            <button class="todo__delete-btn btn">
              <img class="img" src="./remove.svg" alt="">
            </button>
          </li>
        </ul>
      </section>
        
      <section>
        <h2 class="title">Completed</h2>

        <ul id="completed-tasks" class="list">
          <li class="todo__item">
            <label class="todo__label label">
              <input type="checkbox" class="input" checked />
              <span class="todo__text">See the Doctor</span>
            </label>
            <button type="button" class="todo__edit-btn btn">Edit</button>
            <button type="button" class="todo__delete-btn btn">
              <img class="img" src="./remove.svg" alt="">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
