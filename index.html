<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8" />
  </head>

  <body class="page">
    <header class="banner">
      <img class="banner__img" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix image">
      <a class="banner__link" href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </header>

    <main class="main">
      <h1 class="visually-hidden">Todo App</h1>

      <section class="new-task">
        <form class="new-task__form" id="new-task-form">
          <h2 class="new-task__title">Add Item</h2>
          <div class="new-task__controls">
            <input id="new-task-input" class="new-task__input" type="text" required />
            <button type="submit" class="btn btn--primary new-task__submit">Add</button>
          </div>
        </form>
      </section>

      <section class="todo">
        <h2 class="todo__title">Todo</h2>

        <ul id="incomplete-tasks" class="todo__list">
          <li class="todo__item">
            <input type="checkbox" class="todo__checkbox">
            <label class="todo__label">Pay bills</label>
            <input type="text" value="Pay bills" class="todo__input-edit" />
            <button type="button" class="btn btn--ghost todo__btn todo__btn--edit">Edit</button>
            <button type="button" class="btn btn--icon todo__btn todo__btn--delete" aria-label="Delete">
              <img class="todo__icon" src="./remove.svg" alt="">
            </button>
          </li>

          <li class="todo__item todo__item--editing">
            <input type="checkbox" class="todo__checkbox" />
            <label class="todo__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="todo__input-edit" />
            <button class="btn btn--primary todo__btn todo__btn--save">Save</button>
            <button class="btn btn--icon todo__btn todo__btn--delete" aria-label="Delete">
              <img class="todo__icon" src="./remove.svg" alt="">
            </button>
          </li>
        </ul>
      </section>

      <section class="todo">
        <h2 class="todo__title">Completed</h2>

        <ul id="completed-tasks" class="todo__list todo__list--completed">
          <li class="todo__item">
            <input type="checkbox" class="todo__checkbox" checked />
            <label class="todo__label">See the Doctor</label>
            <input type="text" value="See the Doctor" class="todo__input-edit" />
            <button type="button" class="btn btn--ghost todo__btn todo__btn--edit">Edit</button>
            <button type="button" class="btn btn--icon todo__btn todo__btn--delete" aria-label="Delete">
              <img class="todo__icon" src="./remove.svg" alt="">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
